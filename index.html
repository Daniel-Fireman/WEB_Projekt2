<!doctype html>
<html lang="en">

<head>
  <link rel="stylesheet" href="styles.css" />
  <title>Tinker datingsite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <main>
    <fieldset id="login-container">
      <form id="login">
        <label for="profilepic" id="profilepic-selector">+</label>
        <input type="file" id="profilepic" accept="image/*" />
        <br /><br />

        <label for="fullName">Full name</label>
        <br />
        <input id="fullName" name="fullName" placeholder="Full name" />
        <br /><br />

        <label for="email">Email</label>
        <br />
        <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" />
        <br /><br />

        <label for="phone">Phone number</label>
        <br />
        <input type="tel" id="phone" name="phone" placeholder="Phone number" autocomplete="tel-local" />
        <br /><br />

        <label for="password">Password</label>
        <br />
        <input type="password" id="password" name="password" placeholder="Password" />
        <br /><br />

        <label for="gender">Gender</label>
        <br />
        <select id="gender" name="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="female">None of the above</option>
        </select>
        <br /><br />

        <label for="age">Age</label>
        <br />
        <input type="number" id="age" name="age" min="18" max="99" />
        <br /><br />

        <label for="birthday">Birthday</label>
        <br />
        <input type="date" id="birthday" name="birthday" />
        <br /><br />


        <label for="seeking">I am looking for</label>
        <br />
        <div>
          <input type="radio" id="male" name="seeking" value="male" />
          <label for="male">Male</label>

          <input type="radio" id="female" name="seeking" value="female" />
          <label for="female">Female</label>

          <input type="radio" id="both" name="seeking" value="both" />
          <label for="both">Both</label>
        </div>
        <br /><br />

        <label for="interests">Interests</label>
        <br />
        <div>
          <input type="checkbox" id="sports" name="interests" />
          <label for="sports">Sports</label>
          <input type="checkbox" id="gaming" name="interests" />
          <label for="gaming">Gaming</label>
          <input type="checkbox" id="reading" name="interests" />
          <label for="reading">Reading</label>
        </div>
        <br /><br />

        <label for="bio">Bio</label>
        <br />
        <textarea id="bio" name="bio" placeholder="Enter your bio here" rows="6" cols="40"></textarea>
        <br /><br />

        <label for="love">How ready are you for love?</label>
        <br />
        <input type="range" id="love" name="love" min="1" max="10" />
        <br /><br />

        <div>
          <button type="submit">Create account</button>
          <button type="reset">Reset</button>
        </div>
      </form>
    </fieldset>
  </main>
</body>

</html>
